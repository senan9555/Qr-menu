<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VERDE DECOR | Süni Yaşıllıq və Dekorasiya</title>

  <meta name="description"
        content="Süni ağaclar, dekorativ güllər, yaşıl divarlar və interyer yaşıllaşdırma həlləri.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f2;
      color: #1f2a24;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      width: 100%;
      display: block;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e7e9e3;
    }

    .nav {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #315c42;
    }

    .logo span {
      color: #8a9b6e;
    }

    .nav-button {
      background: #315c42;
      color: white;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
    }

    /* HERO */

    .hero {
      min-height: 620px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(
          rgba(20, 35, 27, 0.56),
          rgba(20, 35, 27, 0.56)
        ),
        url("https://images.unsplash.com/photo-1614594575830-2f3f9c4f3d42?auto=format&fit=crop&w=1600&q=85")
        center/cover;
      color: white;
    }

    .hero-content {
      max-width: 680px;
      padding: 80px 0;
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 78px);
      line-height: 0.98;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }

    .hero p {
      font-size: 19px;
      max-width: 600px;
      color: #eef3ed;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 35px;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-primary {
      background: #d7e4b8;
      color: #254632;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* TRUST */

    .trust {
      margin-top: -45px;
      position: relative;
      z-index: 5;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(31,42,36,0.10);
      overflow: hidden;
    }

    .trust-item {
      padding: 24px;
      text-align: center;
      border-right: 1px solid #edf0ea;
    }

    .trust-item:last-child {
      border-right: none;
    }

    .trust-icon {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .trust-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .trust-item span {
      font-size: 13px;
      color: #778078;
    }

    /* SECTION */

    section {
      padding: 90px 0;
    }

    .section-header {
      text-align: center;
      max-width: 650px;
      margin: 0 auto 45px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #78935f;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .section-header h2 {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .section-header p {
      color: #727b74;
    }

    /* PRODUCTS */

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 25px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      white-space: nowrap;
      border: 1px solid #dfe5dc;
      background: white;
      padding: 10px 17px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .category.active,
    .category:hover {
      background: #315c42;
      color: white;
      border-color: #315c42;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #e8ebe5;
      transition: 0.25s;
    }

    .product:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(31,42,36,0.10);
    }

    .product-image {
      height: 245px;
      object-fit: cover;
    }

    .product-body {
      padding: 18px;
    }

    .product-tag {
      font-size: 11px;
      text-transform: uppercase;
      color: #78935f;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .product h3 {
      margin: 5px 0;
      font-size: 19px;
    }

    .product p {
      color: #7b837d;
      font-size: 13px;
      min-height: 42px;
      margin-bottom: 15px;
    }

    .product-button {
      width: 100%;
      border: none;
      background: #eef3e7;
      color: #315c42;
      padding: 12px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .product-button:hover {
      background: #dce8d0;
    }

    /* PROJECTS */

    .projects {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      grid-auto-rows: 240px;
      gap: 15px;
    }

    .project {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      min-height: 220px;
    }

    .project:first-child {
      grid-row: span 2;
    }

    .project img {
      height: 100%;
      object-fit: cover;
      transition: 0.5s;
    }

    .project:hover img {
      transform: scale(1.06);
    }

    .project-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 22px;
      color: white;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
    }

    .project-overlay small {
      opacity: 0.8;
    }

    .project-overlay h3 {
      margin-top: 3px;
    }

    /* SERVICES */

    .services {
      background: #263b2e;
      color: white;
    }

    .services .section-header p {
      color: #bdc9c0;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .service {
      padding: 28px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
    }

    .service-icon {
      font-size: 34px;
      margin-bottom: 18px;
    }

    .service h3 {
      margin-bottom: 8px;
    }

    .service p {
      color: #bdc9c0;
      font-size: 14px;
    }

    /* ABOUT */

    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .about-image {
      height: 500px;
      object-fit: cover;
      border-radius: 25px;
    }

    .about-text h2 {
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .about-text p {
      color: #69736c;
      margin-bottom: 20px;
    }

    .check-list {
      list-style: none;
    }

    .check-list li {
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* CONTACT */

    .contact-box {
      background: #dfe9d2;
      border-radius: 30px;
      padding: 55px;
      text-align: center;
    }

    .contact-box h2 {
      font-size: clamp(30px, 5vw, 45px);
      margin-bottom: 12px;
    }

    .contact-box p {
      color: #59665b;
      margin-bottom: 25px;
    }

    .contact-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .contact-button {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 30px;
      font-weight: 800;
      background: #315c42;
      color: white;
    }

    .map-button {
      background: white;
      color: #315c42;
    }

    /* FOOTER */

    footer {
      background: #1e2c23;
      color: #c7d0ca;
      padding: 40px 0 90px;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-logo {
      color: white;
      font-weight: 800;
      font-size: 20px;
    }

    .footer-small {
      font-size: 13px;
      color: #8e9b92;
    }

    /* MOBILE CTA */

    .mobile-cta {
      display: none;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {

      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .service-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .about {
        grid-template-columns: 1fr;
      }

      .about-image {
        height: 380px;
      }

      .projects {
        grid-template-columns: 1fr 1fr;
      }

      .project:first-child {
        grid-row: span 1;
      }
    }

    @media (max-width: 600px) {

      .nav {
        height: 62px;
      }

      .logo {
        font-size: 18px;
      }

      .nav-button {
        padding: 9px 13px;
        font-size: 12px;
      }

      .hero {
        min-height: 590px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .hero p {
        font-size: 16px;
      }

      .trust-grid {
        grid-template-columns: 1fr;
      }

      .trust-item {
        border-right: none;
        border-bottom: 1px solid #edf0ea;
      }

      .trust-item:last-child {
        border-bottom: none;
      }

      section {
        padding: 65px 0;
      }

      .products {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .product-image {
        height: 180px;
      }

      .product-body {
        padding: 14px;
      }

      .product h3 {
        font-size: 16px;
      }

      .product p {
        font-size: 12px;
      }

      .projects {
        grid-template-columns: 1fr;
        grid-auto-rows: 270px;
      }

      .service-grid {
        grid-template-columns: 1fr;
      }

      .contact-box {
        padding: 35px 20px;
      }

      .mobile-cta {
        display: block;
        position: fixed;
        bottom: 15px;
        left: 15px;
        right: 15px;
        z-index: 2000;
      }

      .mobile-cta a {
        display: block;
        background: #315c42;
        color: white;
        text-align: center;
        padding: 15px;
