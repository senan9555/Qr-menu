<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baku Coffee - Menyu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ee;
            color: #2b2118;
        }

        .hero {
            background: #3b281c;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        .hero h1 {
            margin: 0;
            font-size: 34px;
        }

        .hero p {
            margin-top: 10px;
            opacity: 0.85;
        }

        .menu {
            max-width: 700px;
            margin: auto;
            padding: 25px 20px;
        }

        .category {
            margin-bottom: 30px;
        }

        .category h2 {
            font-size: 22px;
            border-bottom: 2px solid #d6b98c;
            padding-bottom: 10px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px;
            margin: 10px 0;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .item-name {
            font-weight: bold;
        }

        .price {
            font-weight: bold;
            color: #8a5a32;
        }

        .contact {
            margin: 10px 20px 30px;
            padding: 25px;
            text-align: center;
            background: white;
            border-radius: 16px;
        }

        .contact h2 {
            margin-top: 0;
        }

        .whatsapp {
            display: inline-block;
            margin-top: 10px;
            padding: 14px 25px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>☕ Baku Coffee</h1>
        <p>Qəhvə • Desert • İçkilər</p>
    </div>

    <div class="menu">

        <div class="category">
            <h2>☕ Qəhvələr</h2>

            <div class="item">
                <span class="item-name">Espresso</span>
                <span class="price">3 AZN</span>
            </div>

            <div class="item">
                <span class="item-name">Cappuccino</span>
                <span class="price">5 AZN</span>
            </div>

            <div class="item">
                <span class="item-name">Latte</span>
                <span class="price">5 AZN</span>
            </div>
        </div>

        <div class="category">
            <h2>🍰 Desertlər</h2>

            <div class="item">
                <span class="item-name">Cheesecake</span>
                <span class="price">7 AZN</span>
            </div>

            <div class="item">
                <span class="item-name">Brownie</span>
                <span class="price">6 AZN</span>
            </div>
        </div>

        <div class="category">
            <h2>🥤 İçkilər</h2>

            <div class="item">
                <span class="item-name">Fresh Orange</span>
                <span class="price">5 AZN</span>
            </div>

            <div class="item">
                <span class="item-name">Limonad</span>
                <span class="price">4 AZN</span>
            </div>
        </div>

    </div>

    <div class="contact">
        <h2>📍 Bizi tap</h2>

        <p>Bakı, Nizami küçəsi</p>

        <a
            class="whatsapp"
            href="https://wa.me/994501234567">
            💬 WhatsApp
        </a>
    </div>

    <footer>
        © 2026 Baku Coffee
    </footer>

</body>
</html>
